# Activate with: --spring.profiles.active=loadtest
# Keep all credentials outside the repository.
spring.datasource.url=${LOADTEST_DATABASE_URL}
spring.datasource.username=${LOADTEST_DATABASE_USERNAME}
spring.datasource.password=${LOADTEST_DATABASE_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

server.port=${LOADTEST_SERVER_PORT:8081}
JWT_SECRET_KEY=${LOADTEST_JWT_SECRET}

google.calender.holiday.api.key=${LOADTEST_GOOGLE_CALENDAR_API_KEY}
razorpay.key-id=${LOADTEST_RAZORPAY_KEY_ID}
razorpay.key-secret=${LOADTEST_RAZORPAY_KEY_SECRET}
razorpay.currency=INR
